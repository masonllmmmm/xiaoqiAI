<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>小琪AI</title>
<style>
:root{
  --bg:#fff;
  --panel:#fff;
  --panel-2:#f4f5f7;
  --panel-3:#eceef1;
  --border:#e8eaed;
  --text:#1f2126;
  --text-2:#5c6070;
  --text-3:#9aa0ab;
  --primary:#4d6bfe;
  --primary-soft:#eef2ff;
  --danger:#e5484d;
  --ububble:#eef2ff;
  --code-bg:#f7f8fa;
  --shadow:0 2px 10px rgba(20,25,45,.05);
  --shadow-lg:0 10px 36px rgba(20,25,45,.12);
  --head:rgba(255,255,255,.86);
}
[data-theme="dark"]{
  --bg:#16171b;
  --panel:#1b1c21;
  --panel-2:#22242a;
  --panel-3:#2a2c33;
  --border:#282a31;
  --text:#e8eaef;
  --text-2:#a3a8b5;
  --text-3:#767c8a;
  --primary:#6d8ff7;
  --primary-soft:#1f2536;
  --ububble:#242937;
  --code-bg:#1f2126;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 10px 36px rgba(0,0,0,.45);
  --head:rgba(27,28,33,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .28s,color .28s;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}

#app{display:flex;flex-direction:column;height:100%;max-width:768px;margin:0 auto;position:relative;min-width:0}

/* ══ 顶栏 ══ */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--head);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:calc(10px + env(safe-area-inset-top));z-index:20;position:relative;
}
.icb{width:32px;height:32px;border-radius:8px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.icb:active{background:var(--panel-2)}
/* 模式图标 */
.mi{flex:0 0 auto;display:block;opacity:.85}
.mi-wrap{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;opacity:.85}
.item .mi{margin-right:2px}
.item.on .mi{opacity:1}
.chips button .mi{margin-right:2px}
.chips button.on .mi{opacity:1}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand .t{font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand .s{font-size:11px;color:var(--text-3)}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:8px;
  background:var(--panel-2);font-size:12.5px;color:var(--text-2);white-space:nowrap}
.chip:active{background:var(--panel-3)}

/* ══ 主区 ══ */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── 首页 ── */
.hero{padding:min(11vh,84px) 22px 40px;max-width:700px;margin:0 auto}
.hero .mark{
  width:46px;height:46px;border-radius:13px;margin-bottom:16px;
  background:linear-gradient(145deg,#7d93ff,#4d6bfe);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:600;
  box-shadow:0 5px 16px rgba(77,107,254,.26);
}
.hero h1{font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.6px}
.hero p{margin:0;font-size:13.5px;color:var(--text-3)}

/* 大输入框 */
.composer{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:14px 14px 10px;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s;
}
.composer:focus-within{border-color:var(--primary);box-shadow:0 2px 14px rgba(77,107,254,.13)}
.hero .composer{margin-top:26px;border-radius:18px;padding:16px 16px 12px}
#input{
  width:100%;max-height:180px;min-height:52px;resize:none;border:none;outline:none;background:none;
  font-size:15px;line-height:1.6;display:block;
}
#input::placeholder{color:var(--text-3)}
.cbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.cbar .mode{
  display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;
  background:var(--panel-2);font-size:12px;color:var(--text-2);white-space:nowrap;
}
.cbar .mode:active{background:var(--panel-3)}
#send{
  width:34px;height:34px;border-radius:50%;flex:0 0 auto;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .18s,background .18s,transform .12s;margin-left:auto;
}
#send:active{transform:scale(.92)}
#send.off{background:var(--panel-3);color:var(--text-3)}
#send.stop{background:var(--danger)}

/* 快捷 chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chips button{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:8px;background:var(--panel-2);
  font-size:12.5px;color:var(--text-2);transition:background .15s,color .15s;
}
.chips button:active{background:var(--panel-3)}
.chips button.on{background:var(--primary-soft);color:var(--primary)}
.chips .lab{width:100%;font-size:11px;color:var(--text-3);margin:6px 0 0;padding-left:2px}

/* ── 消息流 ── */
.thread{padding:20px 0 8px;max-width:700px;margin:0 auto}
.msg{display:flex;gap:12px;padding:0 20px;margin-bottom:26px;animation:up .32s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg .av{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
  background:linear-gradient(145deg,#7d93ff,#4d6bfe);color:#fff;
}
.msg.me .av{background:var(--panel-3);color:var(--text-2)}
.msg .col{min-width:0;flex:1}
.msg.me{justify-content:flex-end}
.msg.me .col{flex:0 1 auto;display:flex;flex-direction:column;align-items:flex-end}
.ubub{
  background:var(--ububble);border-radius:14px;padding:9px 14px;
  word-break:break-word;white-space:pre-wrap;max-width:100%;
}
.aibub{word-break:break-word;white-space:pre-wrap;font-size:15px;line-height:1.75}
.errbub{background:var(--panel-2);color:var(--danger);font-size:13px;border-radius:12px;padding:11px 13px}
.caret{display:inline-block;width:6px;height:15px;vertical-align:-2px;background:var(--primary);
  animation:bl 1s steps(2) infinite;margin-left:2px;border-radius:1px}
@keyframes bl{50%{opacity:0}}
.acts{margin-top:8px;display:flex;gap:10px;opacity:.3;transition:opacity .2s}
.msg:hover .acts{opacity:1}
.acts button{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.acts button:active{color:var(--primary)}
.aibub pre{background:var(--code-bg);border:1px solid var(--border);border-radius:12px;
  padding:13px 14px;overflow-x:auto;margin:12px 0;font-size:13px;
  white-space:pre-wrap;word-break:break-word;line-height:1.6}
.aibub code{background:var(--code-bg);border-radius:5px;padding:1.5px 5px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.aibub pre code{background:none;padding:0;border:none}
.aibub ul{margin:8px 0;padding-left:21px}
.aibub li{margin:3px 0}
.aibub p{margin:0 0 10px}
.aibub p:last-child{margin-bottom:0}

/* ══ 底栏 ══ */
footer{flex:0 0 auto;padding:10px 20px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 60%,transparent)}
footer .composer{margin:0 auto;max-width:700px;border-radius:16px;padding:11px 12px 9px}
footer #input{min-height:26px;max-height:130px;font-size:14.5px}
footer .cbar{margin-top:7px}
.hint{text-align:center;font-size:10.5px;color:var(--text-3);margin-top:8px;opacity:.75}

/* ══ 抽屉 ══ */
#mask{position:fixed;inset:0;background:rgba(10,12,20,.4);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .26s}
#mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);z-index:51;
  background:var(--panel);display:flex;flex-direction:column;
  transform:translateX(-101%);transition:transform .3s cubic-bezier(.22,.85,.3,1);box-shadow:var(--shadow-lg)}
.drawer.show{transform:none}
.dhead{display:flex;align-items:center;gap:9px;padding:15px 16px 13px;
  padding-top:calc(15px + env(safe-area-inset-top));border-bottom:1px solid var(--border)}
.dhead .mark{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(145deg,#7d93ff,#4d6bfe);display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:12.5px;font-weight:600}
.dhead b{font-size:15px;font-weight:600}
.dbody{flex:1;overflow-y:auto;padding:8px 10px 20px}
.new{width:100%;display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;
  background:var(--primary);color:#fff;font-size:13.5px;font-weight:500;margin:6px 0 12px}
.new:active{opacity:.85}
.sect{font-size:11px;color:var(--text-3);margin:15px 0 6px;padding-left:12px}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  font-size:13.5px;color:var(--text-2);transition:background .15s}
.item.on{background:var(--primary-soft);color:var(--primary);font-weight:500}
.item:active{background:var(--panel-2)}
.item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);flex:0 0 auto}
.tip2{font-size:11.5px;color:var(--text-3);padding:6px 12px}

/* ══ 弹窗 ══ */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(10,12,20,.4)}
.modal.show{display:flex;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:390px;max-height:84vh;overflow-y:auto;background:var(--panel);
  border-radius:18px;padding:22px;box-shadow:var(--shadow-lg);animation:pop .24s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 4px;font-size:16.5px;font-weight:600}
.card .desc{margin:0 0 18px;font-size:12px;color:var(--text-3)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--text-3);margin-bottom:6px;padding-left:2px}
.field input,.field select{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border);
  background:var(--panel-2);font-size:13.5px;outline:none;transition:border-color .16s}
.field input:focus,.field select:focus{border-color:var(--primary)}
.help{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.55;padding-left:2px}

/* 分组列表式设置 */
.grp{margin-bottom:18px}
.grp-t{font-size:11.5px;color:var(--text-3);margin:0 2px 7px;font-weight:500}
.grp .row-i{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:var(--panel-2);border-radius:12px;margin-bottom:2px;
}
.grp .row-i:active{background:var(--panel-3)}
.row-l{display:flex;align-items:center;gap:11px;flex:1;min-width:0;color:var(--text-2)}
.row-c{display:flex;flex-direction:column;min-width:0;gap:1px}
.row-c span{font-size:14px;color:var(--text);line-height:1.35}
.row-c em{font-size:11.5px;color:var(--text-3);font-style:normal;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;color:var(--text-3);background:var(--panel-3);
  padding:3px 8px;border-radius:6px;flex:0 0 auto}
.tag.tap{color:var(--primary);background:var(--primary-soft)}
.chev{color:var(--text-3);opacity:.55;flex:0 0 auto}
.row-i.danger .row-c span{color:var(--danger)}
.row-i.danger .row-l{color:var(--danger)}
.foot-note{text-align:center;font-size:11px;color:var(--text-3);margin-top:22px;
  opacity:.75;line-height:1.75}
.foot-note .icp{margin-top:3px;opacity:.85}
/* 帮助内容 */
.h-item{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.h-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.h-q{font-size:13.5px;font-weight:600;color:var(--text);margin:0 0 5px;line-height:1.5}
.h-a{font-size:12.8px;color:var(--text-2);margin:0;line-height:1.75}
.h-a b{color:var(--text);font-weight:600}
.h-ol{margin:0;padding-left:19px;font-size:12.8px;color:var(--text-2);line-height:1.8}
.h-ol li{margin-bottom:3px}
.h-mode{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.8px;color:var(--text-2)}
.h-mode .mi-wrap{opacity:.9;color:var(--text-2)}
.h-mode b{color:var(--text);font-weight:600;min-width:52px}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--panel-3);
  font-size:11.5px;color:var(--text-2);border:1px solid var(--border)}
#proxyBox{padding:10px 13px;background:var(--panel-2);border-radius:12px;margin-bottom:2px}
#proxyBox .field{margin:0}
.tg{width:44px;height:26px;border-radius:999px;background:var(--panel-3);position:relative;
  transition:background .2s;flex:0 0 auto}
.tg.on{background:var(--primary)}
.tg i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .22s cubic-bezier(.2,.8,.3,1);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tg.on i{transform:translateX(18px)}
/* 侧栏：历史计数 + 删除按钮 + 清空全部 */
.cnt{margin-left:6px;font-size:10.5px;color:var(--text-3);opacity:.8}
.item{position:relative}
.item .del{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--text-3);
  opacity:0;transition:opacity .15s,background .15s,color .15s;
}
.item .del:hover{background:var(--panel-3);color:var(--danger)}
.item .n{padding-right:30px}
.clearall{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:12px;padding:11px;border-radius:11px;
  background:var(--panel-2);color:var(--danger);font-size:13.5px;
  border:1px solid transparent;transition:background .15s,border-color .15s;
}
.clearall:active{background:var(--panel-3)}
.clearall:hover{background:var(--panel-3);border-color:var(--border)}
.clearall[hidden]{display:none}
/* 撤销 toast */
.toast.undo{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 17px;border-radius:999px}
.toast.undo .ub{
  background:rgba(255,255,255,.18);border:none;color:#fff;
  padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:500;
}
.toast.undo .ub:active{background:rgba(255,255,255,.3)}
/* 确认弹窗按钮 */
.btn.del{background:var(--danger);color:#fff}
/* 重试提示条 */
.retry-hint{
  position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(6px);
  background:var(--panel);border:1px solid var(--border);
  box-shadow:var(--shadow);color:var(--text-2);
  padding:7px 15px;border-radius:999px;font-size:12.5px;
  z-index:90;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.retry-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
.retry-hint::before{
  content:'';width:12px;height:12px;border-radius:50%;flex:0 0 auto;
  border:2px solid var(--primary);border-top-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:1024px){
  .retry-hint{bottom:124px}
}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(6px);
  background:rgba(20,22,30,.9);color:#fff;padding:9px 17px;border-radius:999px;font-size:12.5px;
  z-index:99;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
/* ══════════ 平板（≥768px）══════════ */
@media(min-width:768px){
  .hero{padding:min(13vh,110px) 32px 44px}
  .hero h1{font-size:28px}
  .msg{padding:0 28px}
  .thread{padding:26px 0 10px}
  footer{padding:12px 28px calc(14px + env(safe-area-inset-bottom))}
  header{padding:11px 20px;padding-top:calc(11px + env(safe-area-inset-top))}
}

/* ══════════ PC（≥1024px）：侧栏常驻 ══════════ */
@media(min-width:1024px){
  body{display:flex;background:var(--panel-2)}

  /* 抽屉 → 固定侧栏 */
  .drawer{
    position:relative;top:auto;bottom:auto;left:auto;right:auto;
    order:-1;flex:0 0 264px;width:264px;height:100%;
    transform:none!important;box-shadow:none;
    border-right:1px solid var(--border);
  }
  #mask{display:none!important}
  #menuBtn{display:none}
  #closeDrawer{display:none}
  .dhead{padding-top:15px}

  /* 主区 */
  #app{flex:1;max-width:none;height:100%;
    box-shadow:var(--shadow-lg);border-left:none;border-right:1px solid var(--border)}
  header{padding:12px 24px;padding-top:12px}
  main{padding-bottom:4px}

  /* 内容居中限宽，避免超宽屏拉成一条线 */
  .hero{max-width:760px;padding:min(14vh,120px) 36px 48px}
  .hero h1{font-size:31px}
  .hero p{font-size:14px}
  .thread{max-width:820px;padding:28px 0 12px}
  .msg{padding:0 36px}
  footer{padding:14px 36px calc(16px + env(safe-area-inset-bottom))}
  footer .composer{max-width:820px}
  .composer{padding:13px 14px 10px}
  #input{font-size:15px}

  /* 桌面端 hover 反馈（触屏没有 hover） */
  .item:hover{background:var(--panel-2)}
  .item.on:hover{background:var(--primary-soft)}
  .icb:hover{background:var(--panel-2)}
  .chips button:hover{background:var(--panel-3)}
  .new:hover{opacity:.9}
  .acts{opacity:.3}
  .msg:hover .acts{opacity:1}
}

/* ══════════ 超宽屏：内容再收一点 ══════════ */
@media(min-width:1440px){
  .thread{max-width:880px}
  footer .composer{max-width:880px}
}

/* ══════════ 手机小屏（≤400px）═════════ */
@media(max-width:400px){
  header{padding:9px 10px;padding-top:calc(9px + env(safe-area-inset-top));gap:7px}
  .brand .t{font-size:14px}
  .chip{padding:0 9px;font-size:12px}
  .hero{padding:min(8vh,56px) 16px 32px}
  .hero h1{font-size:23px}
  .hero .mark{width:42px;height:42px;font-size:18px;margin-bottom:14px}
  .msg{padding:0 14px;gap:10px}
  .msg .av{width:24px;height:24px;font-size:11px}
  footer{padding:9px 14px calc(10px + env(safe-area-inset-bottom))}
  .chips button{font-size:12px;padding:6px 10px}
  .hint{font-size:10px}
}

/* ══════════ 横屏矮屏 ══════════ */
@media(max-height:520px) and (orientation:landscape){
  .hero{padding:min(6vh,32px) 22px 28px}
  .hero h1{font-size:22px}
  .hero .composer{margin-top:18px}
}

/* 触屏设备去掉 hover 残留高亮，删除按钮常显 */
@media(hover:none){
  .item:hover{background:none}
  .item.on:hover{background:var(--primary-soft)}
  .icb:hover{background:none}
  .item .del{opacity:.5}
}
@media(hover:hover){
  .item:hover .del{opacity:1}
}

/* 尊重系统减少动效 */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">

  <header>

<script>
/* ═══════════════════════════════════════════════
   接口配置（已内置，打开即用，无需用户填写）
   换 Key 只改下面这一行即可
   ═══════════════════════════════════════════════ */
const BUILTIN_KEY   = 'PASTE_YOUR_ZHIPU_KEY_HERE';
const BUILTIN_MODEL = 'glm-4.7-flash';
const BUILTIN_PROXY = '';          // 跨域时才填，例如 https://xxx.workers.dev/v4
const BUILTIN_ICP   = '津ICP备2025032590号';   // 显示在设置页最底部

/* 模式图标（线性描边，24 视窗） */
const MI={
  general:'<path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"/><path d="M8.5 11.5h7M8.5 15h4"/>',
  write:'<path d="M15.5 3.5l5 5L8 21H3v-5z"/><path d="M13.5 5.5l5 5"/>',
  code:'<path d="M8.5 8L4 12.5 8.5 17"/><path d="M15.5 8l4.5 4.5-4.5 5"/><path d="M13.5 5l-3 14"/>',
  translate:'<path d="M3.5 6h9"/><path d="M8 4v2.5c0 2.5-1.8 4.5-4.5 5.5"/><path d="M5.5 10c1 2.2 2.8 3.8 5 4.5"/><path d="M13 20l4.5-11 4.5 11"/><path d="M14.8 16.6h5.4"/>',
  study:'<path d="M3.5 7.5L12 4l8.5 3.5L12 11z"/><path d="M7 9.4V16c0 1.7 2.2 3 5 3s5-1.3 5-3V9.4"/><path d="M21 7.5v6"/>',
  idea:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6v.5h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/>'
};
const mIcon=(id,s)=>`<svg class="mi" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${MI[id]||MI.general}</svg>`;

const MODES=[
  {id:'general', name:'通用助手', short:'通用', desc:'日常问答、查资料、聊想法', sys:'你是小琪，一个友好、简洁的中文助手。回答准确有用，语气自然。'},
  {id:'write',   name:'写作润色', short:'写作', desc:'写文案、改稿子、润色表达', sys:'你是资深中文编辑。帮用户写作、润色、改写，输出直接可用，不要过多解释。'},
  {id:'code',    name:'编程助手', short:'编程', desc:'写代码、找 bug、解释报错', sys:'你是资深程序员。给出可直接运行的代码，代码用代码块包裹，并简要说明关键点。'},
  {id:'translate',name:'翻译',    short:'翻译', desc:'中英等多语种互译', sys:'你是专业翻译。中英互译准确通顺，保留原文格式，只输出译文。'},
  {id:'study',   name:'学习辅导', short:'学习', desc:'讲知识点、拆解难题', sys:'你是耐心的老师。讲解清晰、循序渐进，多用例子，帮助学生真正理解。'},
  {id:'idea',    name:'创意灵感', short:'创意', desc:'头脑风暴、出点子、想选题', sys:'你富有创意。帮用户头脑风暴，给出新颖具体的点子，简明扼要。'}
];
const QUICK=['帮我写一封请假条','解释一下什么是闭包','把这段话翻译成英文','给我 5 个短视频选题'];

/* ══════ 请求容错：重试 + 说人话的错误提示 ══════ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 429 限流 / 5xx 服务端故障 / 网络错误 → 可重试 */
const isRetryable=s=>s===429||s===500||s===502||s===503||s===504;
function friendlyErr(status,raw){
  if(status===429) return '当前使用的人有点多，稍等一下再试试～';
  if(status===401) return '接口密钥无效或已过期，请联系作者更新。';
  if(status===400) return '请求内容不符合要求，换种说法试试。';
  if(status===403) return '该模型暂时不可用，请联系作者更换模型。';
  if(status>=500)  return '服务方开小差了，稍后再试～';
  return raw||('请求失败（'+status+'）');
}
function showRetryHint(n){
  const el=document.querySelector('.retry-hint');
  if(el){el.textContent='服务繁忙，正在重试第 '+n+' 次…';el.classList.add('show');}
}
function hideRetryHint(){
  const el=document.querySelector('.retry-hint');
  if(el)el.classList.remove('show');
}
const LS_CFG='xq_cfg',LS_CHATS='xq_chats',LS_CUR='xq_cur';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* key / model / proxy 全部内置，界面不可改；只有 theme 读本地 */
const _saved=load(LS_CFG,{});
let cfg={key:BUILTIN_KEY,model:BUILTIN_MODEL,proxy:BUILTIN_PROXY,
         theme:_saved.theme||'light'};
let chats=load(LS_CHATS,[]);
let curId=load(LS_CUR,null);
let streaming=false,controller=null;

const $=s=>document.querySelector(s);
const list=$('#list'),footer=$('#footer'),composer=$('#composer'),input=$('#input'),sendBtn=$('#send');
const drawer=$('#drawer'),mask=$('#mask'),setModal=$('#setModal');

function applyTheme(){
  document.documentElement.dataset.theme=cfg.theme;
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.content=cfg.theme==='dark'?'#16171b':'#ffffff';
  $('#cfgTheme').classList.toggle('on',cfg.theme==='dark');
}
function curChat(){
  let c=chats.find(x=>x.id===curId);
  if(!c){c={id:Date.now()+'',title:'新对话',mode:'general',msgs:[]};chats.unshift(c);curId=c.id;}
  return c;
}
const persist=()=>{save(LS_CHATS,chats);save(LS_CUR,curId)};

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(src){
  const blocks=[];
  let t=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<pre><code>'+esc(code.replace(/\n$/,'')).trim()+'</code></pre>');
    return '\u0000B'+(blocks.length-1)+'\u0000';
  });
  t=esc(t);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>[\s\S]*?<\/li>)(\n<li>[\s\S]*?<\/li>)*/g,m=>'<ul>'+m+'</ul>');
  t=t.split(/\n{2,}/).map(p=>/^<(ul|pre|li)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return t.replace(/\u0000B(\d+)\u0000/g,(m,i)=>blocks[+i]);
}
const ICON_COPY='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_SEND='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ICON_STOP='<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';

/* 输入框：首页居中 / 对话时移到底栏 */
function placeComposer(toFooter){
  if(toFooter){
    if(composer.parentElement!==footer){ footer.insertBefore(composer,footer.firstChild); footer.hidden=false; }
  }else{
    const slot=$('#heroSlot');
    if(slot&&composer.parentElement!==slot){ slot.appendChild(composer); footer.hidden=true; }
  }
}

function render(){
  const c=curChat();
  const has=c.msgs.length>0;
  if(!has){
    list.innerHTML=`<div class="hero">
      <div class="mark">琪</div>
      <h1>你好，我是小琪</h1>
      <p>有什么可以帮你的吗？</p>
      <div id="heroSlot"></div>
      <div class="chips">
        <div class="lab">对话模式</div>
        ${MODES.map(m=>`<button data-mode="${m.id}" class="${m.id===c.mode?'on':''}">${mIcon(m.id,14)}${m.name}</button>`).join('')}
        <div class="lab">试试这样问</div>
        ${QUICK.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}
      </div>
    </div>`;
    placeComposer(false);
    list.querySelectorAll('.chips button[data-mode]').forEach(b=>{
      b.onclick=()=>{c.mode=b.dataset.mode;persist();syncMode();render()};
    });
    list.querySelectorAll('.chips button[data-q]').forEach(b=>{
      b.onclick=()=>{input.value=b.dataset.q;autoSize();syncIdle();input.focus()};
    });
    return;
  }
  list.innerHTML=`<div class="thread">${c.msgs.map((m,i)=>{
    let body;
    if(m.err)body=esc(m.content);
    else if(m.role==='user')body=esc(m.content);
    else body=md(m.content);
    const caret=m.typing?'<span class="caret"></span>':'';
    const inner=m.role==='user'
      ? `<div class="ubub">${body}</div>`
      : `<div class="${m.err?'errbub':'aibub'}">${body}${caret}</div>`;
    const acts=(m.role==='ai'&&!m.err&&!m.typing)
      ? `<div class="acts"><button data-i="${i}">${ICON_COPY}复制</button></div>`:'';
    return `<div class="msg ${m.role==='user'?'me':'ai'}">
      <div class="av">${m.role==='user'?'我':'琪'}</div>
      <div class="col">${inner}${acts}</div></div>`;
  }).join('')}</div>`;
  placeComposer(true);
  list.querySelectorAll('.acts button').forEach(b=>{
    b.onclick=()=>navigator.clipboard?.writeText(c.msgs[+b.dataset.i].content)
      .then(()=>toast('已复制'),()=>toast('复制失败'));
  });
  scrollBottom();
}
const scrollBottom=()=>{list.scrollTop=list.scrollHeight};

function renderSide(){
  const c=curChat();
  $('#modeList').innerHTML=MODES.map(m=>
    `<div class="item ${m.id===c.mode?'on':''}" data-mode="${m.id}">
      ${mIcon(m.id,18)}<span class="n">${m.name}</span>${m.id===c.mode?'<span class="dot"></span>':''}</div>`).join('');
  $('#modeList').querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>{c.mode=el.dataset.mode;persist();syncMode();renderSide();closeDrawer()};
  });
  $('#histCnt').textContent=chats.length?('共 '+chats.length+' 条'):'';
  $('#clearAll').hidden=chats.length===0;
  $('#historyList').innerHTML=chats.length?chats.map(x=>
    `<div class="item ${x.id===curId?'on':''}" data-id="${x.id}">
      <span class="n">${esc(x.title)}</span>
      <button class="del" data-del="${x.id}" title="删除这条">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M6 7l.9 12.1A1.5 1.5 0 0 0 8.4 20.5h7.2a1.5 1.5 0 0 0 1.5-1.4L18 7"/><path d="M10.5 11v6M13.5 11v6"/></svg>
      </button>
    </div>`).join('')
    :'<div class="tip2">暂无记录</div>';
  $('#historyList').querySelectorAll('.item').forEach(el=>{
    el.onclick=e=>{
      if(e.target.closest('.del'))return;
      curId=el.dataset.id;persist();syncMode();render();renderSide();closeDrawer();
    };
  });
  $('#historyList').querySelectorAll('.del').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();delOne(btn.dataset.del)};
  });
}

/* ══════ 删除单条（可撤销） ══════ */
let undoBuf=null,undoTimer=null;
function delOne(id){
  const i=chats.findIndex(x=>x.id===id);
  if(i<0)return;
  const removed=chats[i];
  undoBuf={item:removed,index:i,wasCur:curId===id};
  chats.splice(i,1);
  if(curId===id)curId=chats.length?chats[Math.min(i,chats.length-1)].id:null;
  persist();render();renderSide();
  toastUndo('已删除「'+removed.title+'」');
}
function toastUndo(msg){
  const t=$('#toast');
  t.className='toast undo show';
  t.innerHTML='<span>'+esc(msg)+'</span><button class="ub">撤销</button>';
  t.querySelector('.ub').onclick=()=>{
    if(!undoBuf)return;
    chats.splice(Math.min(undoBuf.index,chats.length),0,undoBuf.item);
    if(undoBuf.wasCur)curId=undoBuf.item.id;
    undoBuf=null;persist();render();renderSide();
    t.className='toast';toast('已恢复');
  };
  clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{undoBuf=null;t.className='toast'},3600);
}

/* ══════ 清空全部（带确认弹窗） ══════ */
const confirmModal=$('#confirmModal');
function askClearAll(){
  const n=chats.length;
  if(!n){toast('暂无对话记录');return}
  $('#cfDesc').textContent='共 '+n+' 条对话记录将被删除，此操作不可恢复。';
  confirmModal.classList.add('show');
}
$('#cfNo').onclick=()=>confirmModal.classList.remove('show');
confirmModal.onclick=e=>{if(e.target===confirmModal)confirmModal.classList.remove('show')};
$('#cfYes').onclick=()=>{
  confirmModal.classList.remove('show');
  chats=[];curId=null;persist();render();renderSide();closeDrawer();toast('已清空全部对话');
};
function syncMode(){
  const c=curChat();
  const m=MODES.find(x=>x.id===c.mode)||MODES[0];
  $('#sub').textContent=m.name;
  $('#modeText').textContent=m.short;
  $('#modeMiniText').textContent=m.name;
  $('#modeMiniIcon').innerHTML=mIcon(m.id,14);
  $('#modeBtnIcon').innerHTML=mIcon(m.id,12);
}

const apiUrl=()=>((cfg.proxy||'').trim()||'https://open.bigmodel.cn/api/paas/v4')
  .replace(/\/+$/,'')+'/chat/completions';

async function stream(text){
  if(streaming)return;
  const c=curChat();
  if(!cfg.key||cfg.key.indexOf('PASTE_YOUR')===0){
    toast('未配置接口，请联系作者');return;
  }
  c.msgs.push({role:'user',content:text});
  if(c.msgs.length===1)c.title=text.slice(0,18);
  c.msgs.push({role:'ai',content:'',typing:true});
  streaming=true;setBtn(true);render();persist();

  const mode=MODES.find(m=>m.id===c.mode)||MODES[0];
  const body={model:cfg.model,stream:true,temperature:.7,
    messages:[{role:'system',content:mode.sys}].concat(
      c.msgs.filter(m=>!m.typing&&!m.err).slice(-20).map(m=>({role:m.role,content:m.content})))};
  controller=new AbortController();
  try{
    /* 429/5xx 自动重试：指数退避 1s → 2s → 4s */
    let res=null,lastErr='';
    for(let attempt=0;attempt<4;attempt++){
      if(attempt>0){
        showRetryHint(attempt);          // 界面提示"正在重试…"
        await sleep(1000*Math.pow(2,attempt-1));
      }
      try{
        res=await fetch(apiUrl(),{method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
          body:JSON.stringify(body),signal:controller.signal});
      }catch(fe){
        if(fe.name==='AbortError')throw fe;
        lastErr='网络连接失败';
        continue;                        // 网络错误也重试
      }
      if(res.ok)break;
      let d='';try{d=(await res.json()).error?.message||''}catch(e){}
      lastErr=friendlyErr(res.status,d);
      if(!isRetryable(res.status))break; // 401/400 等不可重试，直接抛
      if(attempt===3)throw new Error(lastErr);
    }
    if(!res||!res.ok)throw new Error(lastErr||'请求失败');
    hideRetryHint();
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='',tick=0;
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        const s=ln.trim();
        if(!s.startsWith('data:'))continue;
        const data=s.slice(5).trim();
        if(data==='[DONE]'){buf='';break}
        try{
          const j=JSON.parse(data);
          const delta=j.choices?.[0]?.delta?.content||'';
          if(delta){
            const last=c.msgs[c.msgs.length-1];
            last.content+=delta;
            if(++tick%2===0||delta.includes('\n')){
              const bs=list.querySelectorAll('.msg.ai .aibub');
              if(bs.length)bs[bs.length-1].innerHTML=md(last.content)+'<span class="caret"></span>';
              scrollBottom();
            }
          }
        }catch(e){}
      }
    }
  }catch(err){
    hideRetryHint();
    const last=c.msgs[c.msgs.length-1];
    if(err.name!=='AbortError'){
      last.err=true;
      last.content=String(err.message||err)+'\n\n点输入框左边的按钮可重新发送。';
    }
  }finally{
    const last=c.msgs[c.msgs.length-1];
    last.typing=false;streaming=false;setBtn(false);controller=null;
    render();persist();renderSide();
  }
}

function setBtn(stop){
  sendBtn.classList.toggle('stop',stop);
  sendBtn.innerHTML=stop?ICON_STOP:ICON_SEND;
}
function autoSize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'}
function syncIdle(){sendBtn.classList.toggle('off',!input.value.trim()&&!streaming)}
function send(){
  const t=input.value.trim();
  if(!t)return;
  if(streaming){controller?.abort();return}
  input.value='';autoSize();syncIdle();stream(t);
}
function toast(msg){
  const t=$('#toast');
  t.className='toast';t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);
}
const openDrawer=()=>{drawer.classList.add('show');mask.classList.add('show')};
const closeDrawer=()=>{drawer.classList.remove('show');mask.classList.remove('show')};
const MAIL='1355296858@qq.com';
function openSet(){
  $('#cfgModelText').textContent=cfg.model;
  $('#cfgTheme').classList.toggle('on',cfg.theme==='dark');
  setModal.classList.add('show');
}
$('#copyMail').onclick=()=>{
  navigator.clipboard?.writeText(MAIL).then(()=>toast('邮箱已复制'),()=>toast('复制失败'));
};

$('#menuBtn').onclick=openDrawer;
$('#closeDrawer').onclick=closeDrawer;
mask.onclick=closeDrawer;
$('#modeBtn').onclick=()=>{openDrawer();setTimeout(()=>$('#modeList').scrollIntoView({block:'center'}),320)};
$('#modeMini').onclick=()=>{openDrawer();setTimeout(()=>$('#modeList').scrollIntoView({block:'center'}),320)};
$('#setBtn').onclick=openSet;
$('#newChat').onclick=()=>{curId=null;persist();render();renderSide();closeDrawer()};
$('#clearAll').onclick=askClearAll;
sendBtn.onclick=()=>{streaming?controller?.abort():send()};
input.addEventListener('input',()=>{autoSize();syncIdle()});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
});
$('#cfgTheme').onclick=()=>{cfg.theme=cfg.theme==='dark'?'light':'dark';applyTheme();save(LS_CFG,cfg)};
/* ═══════ 帮助 ═══════ */

$('#helpFaq').onclick=()=>showHelp('faq');
$('#helpMail').onclick=()=>navigator.clipboard?.writeText(MAIL)
  .then(()=>toast('邮箱已复制'),()=>toast('复制失败'));

helpModal.onclick=e=>{if(e.target===helpModal)helpModal.classList.remove('show')};

$('#cfgClear').onclick=()=>{
  setModal.classList.remove('show');
  setTimeout(askClearAll,180);
};
setModal.onclick=e=>{if(e.target===setModal)setModal.classList.remove('show')};

applyTheme();syncMode();setBtn(false);syncIdle();render();renderSide();
